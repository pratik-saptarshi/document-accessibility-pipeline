name: Security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/google/go-licenses/v2@v2.0.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test policy and project packages
        run: go test -race ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Lint workflow files
        run: actionlint
      - name: Check vulnerabilities including tests
        run: govulncheck -test ./...
      - name: Check test-inclusive dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          allowed_licenses="$(grep -Ev '^[[:space:]]*(#|$)' .security/allowed-go-licenses.txt | paste -sd, -)"
          test -n "$allowed_licenses"
          go-licenses check --include_tests --allowed_licenses="$allowed_licenses" ./...
      - name: Verify license policy rejects a test-only forbidden dependency
        run: bash .github/scripts/test-go-licenses.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Verify Gitleaks clean, finding, and error behavior
        run: bash .github/scripts/test-gitleaks.sh
      - name: Gitleaks full-history scan
        run: gitleaks git --log-opts=--all --redact=100 --ignore-gitleaks-allow --config=.security/gitleaks.toml --gitleaks-ignore-path=/dev/null --no-banner --timeout=300 .
