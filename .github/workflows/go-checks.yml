name: Go checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Keep pdfcpu out of the financial fixtures CLI dependency graph
        run: |
          set -euo pipefail
          dependency_graph="$(mktemp)"
          trap 'rm -f "$dependency_graph"' EXIT
          if ! go list -deps ./cmd/financial-fixtures-v2 >"$dependency_graph"; then
            echo "go list dependency scan failed; cannot verify pdfcpu is test-only" >&2
            exit 1
          fi
          if grep -q '^github.com/pdfcpu/' "$dependency_graph"; then
            echo "pdfcpu must remain test-only, outside the financial fixtures CLI dependency graph" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "dependency graph search failed with status $grep_status" >&2
              exit 1
            fi
          fi
      # Provenance (R5-15; ADR 0011 decision 4): poppler-utils is a
      # GPL-licensed PDF text-extraction tool approved for CI-only use (it
      # backs the internal/financialfixtures preservation tests). Source:
      # Ubuntu noble-updates (archive.ubuntu.com/ubuntu). Pinned to the
      # version resolved on the ubuntu-latest runner image; re-pin
      # deliberately when the image package set moves. apt fails closed on
      # an unresolvable pin, so drift breaks the build instead of silently
      # changing tool behavior.
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils=24.02.0-1ubuntu9.10
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Validate profile schemas with Draft 2020-12 behavior cases
        run: node scripts/test-profile-schema-regex.cjs && python3 -m pip install --disable-pip-version-check --requirement scripts/profile-schema-test-requirements.txt && python3 scripts/test-profile-schemas.py
      - name: Test source publisher guard
        run: bash -n scripts/source-publisher.sh .github/scripts/test-source-publisher.sh && bash .github/scripts/test-source-publisher.sh
      - name: Check module files
        run: go mod tidy -diff
      - name: Check traceability catalog
        run: go run ./cmd/traceability-check
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        env:
          DAP_BEADS_SOURCE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go test -race ./...
      - name: Test standalone cloud bootstrap module
        working-directory: cmd/cloud-tools-bootstrap
        run: go test -race ./...
      - name: Vet standalone cloud bootstrap module
        working-directory: cmd/cloud-tools-bootstrap
        run: go vet ./...
      # Keep the authenticated Java CLI confined to the veraPDF integration job.
      - name: Test PDF/UA-2 adapter module
        working-directory: ci/pdfua2/adapter
        run: env PDFUA_REAL_CLI_JAR= go test -race ./... -count=1
      - name: Vet PDF/UA-2 adapter module
        working-directory: ci/pdfua2/adapter
        run: go vet ./...
      - name: Check adapter module files
        working-directory: ci/pdfua2/adapter
        run: go mod tidy -diff
      - name: Check cloud bootstrap module files
        working-directory: cmd/cloud-tools-bootstrap
        run: go mod tidy -diff
      - name: Check cloud bootstrap shell syntax
        run: bash -n scripts/bootstrap-cloud-build-tools.sh
