name: Go checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Keep pdfcpu out of the financial fixtures CLI dependency graph
        run: |
          set -euo pipefail
          dependency_graph="$(mktemp)"
          trap 'rm -f "$dependency_graph"' EXIT
          if ! go list -deps ./cmd/financial-fixtures-v2 >"$dependency_graph"; then
            echo "go list dependency scan failed; cannot verify pdfcpu is test-only" >&2
            exit 1
          fi
          if grep -q '^github.com/pdfcpu/' "$dependency_graph"; then
            echo "pdfcpu must remain test-only, outside the financial fixtures CLI dependency graph" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "dependency graph search failed with status $grep_status" >&2
              exit 1
            fi
          fi
      - name: Test pinned Poppler acquisition provenance
        run: bash .github/scripts/test-pinned-poppler-install.sh
      # Provenance (R5-15; ADR 0011 decision 4): poppler-utils is a
      # GPL-licensed PDF text-extraction tool approved for CI-only use. Keep
      # version 24.02.0-1ubuntu9.11 and the Ubuntu 24.04 runner pinned together. The
      # acquisition script verifies the downloaded .deb against SHA256 in
      # authenticated Ubuntu Noble APT metadata and retains version,
      # architecture, configured official mirror candidates, and digest in
      # the run summary without claiming which candidate served the package.
      - name: Install poppler-utils
        run: bash .github/scripts/install-pinned-poppler.sh
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Validate profile schemas with Draft 2020-12 behavior cases
        run: node scripts/test-profile-schema-regex.cjs && python3 -m pip install --disable-pip-version-check --requirement scripts/profile-schema-test-requirements.txt && python3 scripts/test-profile-schemas.py
      - name: Test source publisher guard
        run: bash -n scripts/source-publisher.sh .github/scripts/test-source-publisher.sh && bash .github/scripts/test-source-publisher.sh
      - name: Check module files
        run: go mod tidy -diff
      - name: Check traceability catalog
        run: go run ./cmd/traceability-check
      - name: Vet
        run: go vet ./...
      # Provision the exact Beads 1.3.1 release binary the gated contract
      # tests in cmd/beads-export-reconcile pin by SHA-256 (see
      # docs/tools/beads-export-reconcile.md). The digest is verified before
      # the binary is used; a mismatch fails this step and the gated tests
      # never run against an unverified binary.
      - name: Install pinned Beads for gated contract tests
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/beads-1.3.1"
          mkdir -p "$tool_dir"
          curl --proto '=https' --fail --location --silent --show-error \
            https://github.com/steveyegge/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz \
            --output "$tool_dir/beads_1.3.1_linux_amd64.tar.gz"
          tar --no-same-owner -xzf "$tool_dir/beads_1.3.1_linux_amd64.tar.gz" -C "$tool_dir" bd
          echo "a8f48d771b9e11eccfced4aed72923b59eda746f7a9b425e7ca1af7a51251653  $tool_dir/bd" | sha256sum --check
      - name: Test with race detector
        env:
          DAP_BEADS_SOURCE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DAP_BD_BINARY: ${{ runner.temp }}/beads-1.3.1/bd }}
        run: go test -race ./...
      - name: Test standalone cloud bootstrap module
        working-directory: cmd/cloud-tools-bootstrap
        run: go test -race ./...
      - name: Vet standalone cloud bootstrap module
        working-directory: cmd/cloud-tools-bootstrap
        run: go vet ./...
      # Keep the authenticated Java CLI confined to the veraPDF integration job.
      - name: Test PDF/UA-2 adapter module
        working-directory: ci/pdfua2/adapter
        run: env PDFUA_REAL_CLI_JAR= go test -race ./... -count=1
      - name: Vet PDF/UA-2 adapter module
        working-directory: ci/pdfua2/adapter
        run: go vet ./...
      - name: Check adapter module files
        working-directory: ci/pdfua2/adapter
        run: go mod tidy -diff
      - name: Check cloud bootstrap module files
        working-directory: cmd/cloud-tools-bootstrap
        run: go mod tidy -diff
      - name: Check cloud bootstrap shell syntax
        run: bash -n scripts/bootstrap-cloud-build-tools.sh
